name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'OtherOfIce/whisper-dictation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Test desktop code
        run: npm test
        working-directory: desktop
      - name: Test native engine
        run: dotnet run --project tests/LocalWhisper.Tests -c Release
      - name: Build native engine
        run: dotnet publish src/LocalWhisper -c Release -r win-x64 --self-contained true -o dist/engine
      - name: Test engine protocol
        run: npm run test:engine
        working-directory: desktop

      - name: Check that this commit is still main
        id: head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the main branch.' }
          "current=$($latest.Trim() -eq $env:GITHUB_SHA)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Build and publish Windows installer
        if: steps.head.outputs.current == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "0.4.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing.Trim() -ne 'true') { Write-Host "$tag is already published."; exit 0 }
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the incomplete draft release.' }
          }
          gh release create $tag --draft --target $env:GITHUB_SHA --title "Local Whisper $version" --notes 'Building installer and update metadata.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }

          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the release version.' }

          npm run package:installer -- --publish always
          if ($LASTEXITCODE -ne 0) { throw 'Installer build or upload failed.' }

          $assets = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or 'LocalWhisper-Setup.exe' -notin $assets -or 'latest.yml' -notin $assets) {
            throw 'The draft release is missing the installer or update metadata.'
          }

          $previousTag = gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not find the previous release.' }
          if ($previousTag) {
            $comparePath = 'repos/{0}/compare/{1}...{2}' -f $env:GITHUB_REPOSITORY, $previousTag.Trim(), $env:GITHUB_SHA
            $commits = @(gh api $comparePath --paginate --jq '.commits[] | .commit.message | split("\n")[0]')
            if ($LASTEXITCODE -ne 0) { throw 'Could not list changes since the previous release.' }
            $notes = @("Changes since $previousTag", '') + @($commits | ForEach-Object { "- $_" })
          } else {
            $notes = @('Initial Windows installer and automatic updates.', '', "- $env:GITHUB_SHA")
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'desktop-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value ($notes -join "`n") -Encoding utf8
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not recheck the main branch.' }
          if ($latest.Trim() -ne $env:GITHUB_SHA) {
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not discard the superseded draft release.' }
            Write-Host 'A newer main commit will produce the release.'
            exit 0
          }
          gh release edit $tag --title "Local Whisper $version" --notes-file $notesPath --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
